<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="/manifest.json">
  <title>Salem PBC - Church Operating System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-50 dark:bg-canvas-dark text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- Instant Preloader Splash: Guarantees zero blank screen while scripts compile -->
  <div id="preloader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 text-white transition-opacity duration-300">
    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-3xl mb-4 shadow-xl shadow-indigo-500/30">
      ⛪
    </div>
    <div class="text-lg font-bold">Salem PBC</div>
    <div class="text-xs text-slate-400 mt-1">Church Operating System</div>
    <div class="mt-4 flex items-center gap-2 text-xs text-indigo-400">
      <span class="w-3.5 h-3.5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></span>
      <span>Loading Church Portal...</span>
    </div>
    <div id="fallback-reload-btn" class="mt-6" style="display: none;">
      <button id="fallback-reload-btn-action" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-xl text-xs font-bold shadow-lg transition-all">
        🔄 Refresh Page
      </button>
    </div>
  </div>
  

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
