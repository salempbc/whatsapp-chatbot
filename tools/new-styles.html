  <style>
    :root {
      --bg-color: #F2F2F7;
      --surface-color: #FFFFFF;
      --text-color: #000000;
      --hint-color: #8E8E93;
      --border-color: rgba(60,60,67,0.29);
      --accent-color: #007AFF;
      --tab-bg: rgba(255,255,255,0.85);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --surface-color: #1C1C1E;
        --text-color: #FFFFFF;
        --hint-color: rgba(235, 235, 245, 0.6);
        --border-color: rgba(84,84,88,0.65);
        --accent-color: #0A84FF;
        --tab-bg: rgba(28,28,30,0.85);
      }
    }
    body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.015em; padding-bottom: 0; }
    
    .card { background-color: var(--surface-color); border-radius: 10px; padding: 1rem; }
    .btn { background-color: var(--accent-color); color: #ffffff; padding: 0.75rem 1rem; border-radius: 12px; font-weight: 600; text-align: center; transition: opacity 0.2s; }
    .btn:active { opacity: 0.7; }
    .btn-secondary { background-color: rgba(128,128,128,0.2); color: var(--text-color); }
    .input { width: 100%; padding: 0.75rem; border-radius: 10px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); margin-top: 0.25rem; font-size: 16px; transition: border-color 0.2s; }
    .input:focus { outline: none; border-color: var(--accent-color); }

    .fade-enter-active, .fade-leave-active { transition: opacity 0.2s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
    .slide-enter-active, .slide-leave-active { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
    .slide-enter-from { transform: translateX(100%); opacity: 0; }
    .slide-leave-to { transform: translateX(-100%); opacity: 0; position: absolute; width: 100%; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--tab-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid var(--border-color); display: flex; justify-content: space-around; padding: 0.5rem 0; z-index: 50; padding-bottom: calc(0.5rem + env(safe-area-inset-bottom, 20px)); }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--hint-color); font-weight: 600; cursor: pointer; }
    .nav-item.active { color: var(--accent-color); }
    .nav-icon { font-size: 24px; margin-bottom: 2px; }

    .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-active { background: rgba(52, 199, 89, 0.2); color: #34c759; }
    .badge-inactive { background: rgba(128, 128, 128, 0.2); color: var(--hint-color); }
    
    .checkbox-custom { width: 22px; height: 22px; accent-color: var(--accent-color); cursor: pointer; border-radius: 50%; }
    
    .bulk-bar { position: fixed; top: 1rem; left: 1rem; right: 1rem; background: var(--surface-color); color: var(--text-color); border-radius: 14px; padding: 1rem; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 0.5px solid var(--border-color); }
    
    .ios-switch { appearance: none; width: 51px; height: 31px; background: rgba(120,120,128,0.16); border-radius: 31px; position: relative; cursor: pointer; outline: none; transition: background 0.3s ease-in-out; flex-shrink: 0; border: 2px solid transparent; }
    .ios-switch:checked { background: #34c759; }
    .ios-switch::after { content: ''; position: absolute; top: 1px; left: 1px; width: 25px; height: 25px; background: #fff; border-radius: 50%; box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.16); transition: transform 0.3s cubic-bezier(0.3, 1.05, 0.4, 1.05); }
    .ios-switch:checked::after { transform: translateX(20px); }
    
    .list-group { background: var(--surface-color); border-radius: 10px; overflow: hidden; margin-bottom: 1.5rem; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 0.5px solid var(--border-color); }
    .list-item:last-child { border-bottom: none; }
    .list-item:active { background: rgba(128,128,128,0.15); }
    
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 100px; font-weight: 600; font-size: 14px; z-index: 9999; backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px; }
    .toast-enter-active, .toast-leave-active { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .toast-enter-from, .toast-leave-to { opacity: 0; transform: translate(-50%, 20px) scale(0.9); }
  </style>
