name: Weekly Database Backup to Private Artifacts

on:
  schedule:
    # Run every Sunday at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  backup:
    name: Backup MongoDB to Encrypted Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Gzipped Database Dump
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo "❌ MONGO_URI secret is not configured in GitHub repository settings."
            exit 1
          fi
          BACKUP_DATE=$(date +'%Y-%m-%d_%H%M%S')
          echo "BACKUP_DATE=$BACKUP_DATE" >> $GITHUB_ENV
          node scripts/run_backup.js

      - name: Upload Backup Artifact (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: spbc-database-backup-${{ env.BACKUP_DATE }}
          path: backups/*.json.gz
          retention-days: 30
