name: CI & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Automated Tests & Integrity Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run automated test suite
        run: npm test

      - name: Run lint, syntax and character encoding check
        run: npm run check

  deploy-staging:
    name: Trigger Staging Auto-Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Staging Deploy Hook (if configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "🚀 Triggering Render Staging Deployment..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
            echo "✅ Render deploy hook triggered successfully."
          else
            echo "ℹ️ RENDER_STAGING_DEPLOY_HOOK secret is not configured. Skipping auto-deploy hook."
          fi
